<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Brainstorm · neon quick pulse dots</title>
<style>
/* Bubble geometry measured from the iPhone screenshot:
   one line = 22 px text + 10 px top/bottom padding (42 px body), corner radius 16 px,
   text inset 16 px. Colors: blue #028AFE, gray #E9E9E9, black text, white on blue. */

*{box-sizing:border-box}
body{margin:0;min-height:100vh;padding:24px 28px;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Arial,sans-serif;background:#fff;color:#111}
h1{font-size:22px;margin:0 0 12px}
button{font:inherit;font-size:14px;padding:7px 12px;border-radius:10px;border:1px solid #d1d1d6;background:#f5f5f7;color:#111;cursor:pointer}
.ctl-row{display:flex;flex-wrap:wrap;justify-content:space-between;gap:10px;align-items:center;margin-bottom:10px}
.actions{display:flex;flex-wrap:wrap;gap:6px}
.zoombar{display:flex;gap:6px;align-items:center;font-size:14px}
.zoombar input[type=range]{width:150px}
#zl{min-width:44px;text-align:center;font-variant-numeric:tabular-nums}
.hint{font-size:13px;color:#8e8e93;margin:10px 0 0}

/* map canvas: pannable and zoomable 2D surface */
#canvas{position:relative;height:calc(100vh - 210px);min-height:460px;overflow:hidden;border-radius:12px;cursor:grab;touch-action:none;background:#fafafa;border:1px solid #e5e5ea}
#canvas.grabbing{cursor:grabbing}
#world{position:absolute;left:0;top:0;transform-origin:0 0}
#world.anim{transition:transform .8s ease}
.links{position:absolute;left:0;top:0;pointer-events:none;overflow:visible}
.links path{fill:none;stroke:rgba(128,128,128,.55);stroke-width:1.5}

/* message nodes */
.node{position:absolute;width:300px;display:flex;flex-direction:column;align-items:center}
/* iMessage bubbles, measured from the iPhone screenshots (1 CSS px = 1 iOS point):
   corner radius 20.25, single-line height 40.76, baseline 26.52 below the top, line pitch 20.17,
   max width 282.57, gray #E9E8EB, blue runs from rgb(67,178,252) at the top of the map view to rgb(0,136,254) at the bottom. */
:root{--bub-them:#E9E8EB;--txt-me:#FFFFFF;--txt-them:#000000;
  --bfs:17px;--bls:0px;--bpt:10.36px;--bpb:10.21px;--bpl:14.8px;--bpr:14.8px;--blue-grad:linear-gradient(rgb(67.0 178.2 252.1),rgb(0.0 136.0 253.8))}
.bubble{--c:var(--bub-them);position:relative;display:inline-block;vertical-align:top;box-sizing:border-box;
  min-width:46px;max-width:282.57px;padding:var(--bpt) var(--bpr) var(--bpb) var(--bpl);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro",Inter,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  font-size:var(--bfs);line-height:20.17px;letter-spacing:var(--bls);font-weight:400;font-style:normal;
  -webkit-font-smoothing:antialiased;text-align:left;overflow-wrap:break-word;white-space:pre-wrap;
  border-radius:20.25px;background:var(--c);color:var(--txt-them);cursor:pointer;user-select:none}
.bubble.me{--c:rgb(2 137 254);color:var(--txt-me);background-image:var(--blue-grad);background-repeat:no-repeat;
  background-size:100% var(--gh,874px);background-position:0 var(--gy,-760px)}
.bubble.tail::after{content:"";position:absolute;right:7.608px;bottom:-6.713px;width:15.820px;height:11.544px;

.23C13.78 2.39 13.67 2.56 13.57 2.73C13.47 2.90 13.38 3.08 13.30 3.26C13.23 3.45 13.16 3.64 13.11 3.83C13.07 4.03 13.04 4.22 13.02 4.42C13.00 4.62 13.00 4.82 13.00 5.02C13.00 5.22 13.01 5.42 13.03 5.62C13.05 5.82 13.08 6.02 13.11 6.21C13.14 6.41 13.18 6.61 13.23 6.80C13.29 6.99 13.36 7.18 13.44 7.36C13.52 7.54 13.61 7.72 13.71 7.89C13.81 8.06 13.94 8.21 14.06 8.38C14.17 8.54 14.27 8.71 14.38 8.89C14.48 9.06 14.58 9.23 14.68 9.40C14.77 9.58 14.89 9.75 14.94 9.94C15.00 10.12 15.04 10.34 15.01 10.52C14.99 10.70 14.89 10.88 14.77 11.02C14.65 11.16 14.46 11.28 14.28 11.34C14.10 11.40 13.90 11.39 13.70 11.37C13.51 11.35 13.32 11.26 13.13 11.20C12.94 11.14 12.75 11.07 12.57 10.99C12.38 10.92 12.21 10.83 12.02 10.75C11.84 10.66 11.66 10.58 11.48 10.50C11.30 10.41 11.12 10.32 10.95 10.23C10.77 10.14 10.59 10.04 10.42 9.94C10.24 9.85 10.07 9.75 9.90 9.65C9.72 9.55 9.55 9.44 9.38 9.34C9.21 9.24 9.03 9.15 8.85 9.05C8.68 8.96 8.51 8.86 8.33 8.75C8.16 8.65 7.99 8.55 7.82 8.44C7.66 8.33 7.50 8.21 7.33 8.10C7.17 7.98 7.00 7.88 6.83 7.77C6.67 7.65 6.51 7.53 6.35 7.42C6.18 7.30 6.01 7.20 5.84 7.09C5.68 6.98 5.51 6.87 5.35 6.75C5.19 6.63 5.05 6.49 4.89 6.37C4.73 6.24 4.57 6.12 4.41 6.00C4.25 5.89 4.09 5.76 3.93 5.65C3.76 5.54 3.60 5.43 3.42 5.33C3.25 5.23 3.07 5.15 2.89 5.07C2.70 4.98 2.51 4.87 2.31 4.83C2.12 4.79 1.91 4.83 1.72 4.83C1.52 4.83 1.41 4.83 1.15 4.83C0.89 4.83 0.32 4.90 0.15 4.83C-0.02 4.76 0.15 4.50 0.15 4.43Z'/%3E%3C/svg%3E") 0 0/100% 100% no-repeat;pointer-events:none}
.bubble.me.tail::after{background-image:var(--blue-grad);background-repeat:no-repeat;background-size:100% var(--gh,874px);background-position:0 var(--gy2,-790px)}
.bubble.them.tail::after{right:auto;left:7.608px;transform:scaleX(-1)}
/* highlights follow the whole bubble outline, tail included */
.node.sel .bubble{filter:drop-shadow(1.5px 0 0 #111) drop-shadow(-1.5px 0 0 #111) drop-shadow(0 1.5px 0 #111) drop-shadow(0 -1.5px 0 #111)}
.node.hl .bubble{filter:drop-shadow(0 0 3px rgba(2,138,254,.85))}
.node.armed .bubble{filter:drop-shadow(0 0 3.5px rgba(2,138,254,.95))}
.bubble.editing{cursor:text;user-select:text;outline:none;filter:drop-shadow(0 0 2.5px rgba(2,138,254,.95))}

.more{margin-top:10px; font-size:13px; color:#8e8e93; background:transparent; border:1px dashed #c7c7cc; border-radius:10px; padding:3px 10px}
.tb{position:absolute; top:-40px; left:50%; transform:translateX(-50%); display:flex; gap:4px; background:#fff; border:1px solid #d1d1d6; border-radius:10px; padding:3px; box-shadow:0 2px 8px rgba(0,0,0,.12); white-space:nowrap; z-index:2}
.tb button{padding:4px 9px; font-size:13px; border:none; background:transparent}
.tb button:hover{background:#f0f0f5}
/* Themes change only the page around the map. Bubble colors and geometry stay identical. */
.t0{}
.t1{background:#fff}
.t2{background:#000;color:#fff}
.t2 button{background:#1c1c1e;color:#fff;border-color:#3a3a3c}
.t2 #canvas{background:#0b0b0d;border-color:#2c2c2e}
.t2 .hint,.t2 .more{color:#98989d}
.t2 .tb{background:#1c1c1e;border-color:#3a3a3c}
.t2 .tb button{color:#fff}
.t3{background:#e5e5ea}
.t3 .page{max-width:390px;margin:0 auto;background:#fff;border-radius:44px;padding:36px 14px;box-shadow:0 20px 50px rgba(0,0,0,.2)}
.t3 #canvas{height:520px;min-height:0}
.t3 .actions,.t3 .zoombar{font-size:12px}
.t4{background:#f5f5f7}
.t4 #canvas{background:#fff;border-radius:16px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.t5{background:#0d1117;color:#7ee787;font-family:ui-monospace,Menlo,monospace}
.t5 button{background:#161b22;color:#7ee787;border-color:#30363d;font-family:inherit}
.t5 #canvas{background:#0d1117;border-color:#30363d}
.t5 .hint,.t5 .more{color:#7ee787}
.t5 .tb{background:#161b22;border-color:#30363d}
.t5 .tb button{color:#7ee787}
.t6{background:#f4ecd8;font-family:Georgia,serif}
.t6 button{background:#efe4c8;color:#3b2a16;border-color:#c9b68c;font-family:Georgia,serif}
.t6 #canvas{background:#f9f3e3;border-color:#c9b68c}
.t6 .tb{background:#efe4c8;border-color:#c9b68c}
.t7{background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;min-height:100vh}
.t7 #canvas{background:rgba(255,255,255,.15);border-color:rgba(255,255,255,.4);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.t7 button{background:rgba(255,255,255,.2);color:#fff;border-color:rgba(255,255,255,.4)}
.t7 .hint,.t7 .more{color:#e0e0ff}
.t7 .more{border-color:rgba(255,255,255,.5)}
.t7 .tb{background:rgba(40,30,80,.9);border-color:rgba(255,255,255,.3)}
.t7 .tb button{color:#fff}
.armhint{position:absolute;left:12px;bottom:12px;font-size:13px;padding:5px 10px;border-radius:999px;background:#028AFE;color:#fff;pointer-events:none}

body{margin:0;padding:28px;min-height:100vh;background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",Inter,"Helvetica Neue",Arial,sans-serif}
h1{font-size:22px;margin:0 0 6px} .sub{font-size:14px;color:#e0e0ff;margin:0 0 22px}
.stage{position:relative;width:300px;height:250px;margin:0 auto;background:rgba(255,255,255,.08);border-radius:16px;border:1px solid rgba(255,255,255,.3);overflow:hidden}
.stage .bubble{position:absolute;transform:translateX(-50%);max-width:200px;white-space:nowrap;z-index:1}
.wire{position:absolute;left:0;top:0;z-index:0;overflow:visible}
</style></head><body>
<h1>White neon dots, faster</h1>
<p class="sub">Three white neon dots race along the path and pulse faster.</p>
<div class="stage">
<svg class="wire" viewBox="0 0 300 250" width="300" height="250" aria-hidden="true"><defs><filter id="glow" x="-300%" y="-300%" width="700%" height="700%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>

<animate attributeName="r" values="2.2;5;2.2" dur="0.22s" begin="0s" repeatCount="indefinite"/></circle><circle r="3.6" fill="#FFFFFF"><animateMotion dur="0.45s" begin="0.15s" repeatCount="indefinite" path="M150 71 C150 123 110 117 110 170" calcMode="linear"/>
<animate attributeName="r" values="2.2;5;2.2" dur="0.22s" begin="0.15s" repeatCount="indefinite"/></circle><circle r="3.6" fill="#FFFFFF"><animateMotion dur="0.45s" begin="0.3s" repeatCount="indefinite" path="M150 71 C150 123 110 117 110 170" calcMode="linear"/>
<animate attributeName="r" values="2.2;5;2.2" dur="0.22s" begin="0.3s" repeatCount="indefinite"/></circle></g></svg>
<div class="bubble tail me" style="left:150px;top:30px">hello there</div>
<div class="bubble tail them" style="left:110px;top:170px">sure</div>
</div>
